<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4924a"/>
      <stop offset="50%" stop-color="#c17f3a"/>
      <stop offset="100%" stop-color="#a86a28"/>
    </linearGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbfaf7"/>
      <stop offset="100%" stop-color="#f4f0e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Decorative dots -->
  <circle cx="80" cy="80" r="6" fill="#fff" opacity="0.15"/>
  <circle cx="432" cy="80" r="6" fill="#fff" opacity="0.15"/>
  <circle cx="80" cy="432" r="6" fill="#fff" opacity="0.15"/>
  <circle cx="432" cy="432" r="6" fill="#fff" opacity="0.15"/>

  <!-- Paper/document -->
  <g filter="url(#shadow)" transform="translate(0,-8)">
    <rect x="106" y="116" width="300" height="300" rx="22" ry="22" fill="url(#paper)" stroke="#e8e4dc" stroke-width="2"/>
    
    <!-- Folded corner -->
    <path d="M 366 116 L 406 156 L 366 156 Z" fill="#e8e4dc"/>
    <path d="M 366 116 L 366 156 L 406 156" fill="none" stroke="#d6cebe" stroke-width="1.5"/>

    <!-- Title bar (orange accent) -->
    <rect x="138" y="156" width="160" height="6" rx="3" fill="#c17f3a"/>

    <!-- Markdown M letter -->
    <g transform="translate(146, 188)" fill="#1a1814">
      <path d="M 0 60 L 0 0 L 18 0 L 36 36 L 54 0 L 72 0 L 72 60 L 58 60 L 58 22 L 42 56 L 30 56 L 14 22 L 14 60 Z" 
            fill="#1a1814"/>
    </g>

    <!-- Down arrow next to M (markdown style ↓) -->
    <g transform="translate(232, 188)" stroke="#c17f3a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="14" y1="0" x2="14" y2="50"/>
      <polyline points="0,36 14,52 28,36"/>
    </g>

    <!-- Lines (text mockup) -->
    <rect x="138" y="284" width="220" height="8" rx="4" fill="#d6cebe"/>
    <rect x="138" y="304" width="180" height="8" rx="4" fill="#d6cebe"/>
    <rect x="138" y="324" width="200" height="8" rx="4" fill="#d6cebe"/>
    <rect x="138" y="344" width="140" height="8" rx="4" fill="#c17f3a" opacity="0.5"/>
    <rect x="138" y="372" width="220" height="8" rx="4" fill="#d6cebe"/>
  </g>
</svg>
